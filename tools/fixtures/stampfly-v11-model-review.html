<!doctype html><meta charset="utf-8"><title>StampFly v1.1 source review</title><style>body{margin:0;background:white}canvas{display:block}</style><div id="render"></div><script type="module">
import * as THREE from '/web/platform/vendor/three.module.min.js';
import {createManufacturerModel} from '/web/platform/manufacturer-model.js';
import {applyShellAppearance} from '/web/platform/shell-appearance.js';
const product=(await (await fetch('/web/platform/catalog/products.json')).json()).items.find(x=>x.id==='m5stack-k138-v11');
const scene=new THREE.Scene();scene.background=new THREE.Color('white');scene.add(new THREE.HemisphereLight(0xffffff,0x64775b,2.5));const light=new THREE.DirectionalLight(0xffffff,3.1);scene.add(light);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(800,800,false);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#render').append(renderer.domElement);
const camera=new THREE.OrthographicCamera(-63,63,63,-63,2,3000),model=createManufacturerModel(product,null);scene.add(model.group);await model.ready;
const meta=await (await fetch('/web/platform/assets/m5stack-k138-v11/model.json')).json();
function show(view='front',options={}){const def=meta.reviewViews[view]||{},span=options.span||def.span||124.7,target=options.target||def.target||[0,0,0],position=options.position||def.position||(view==='front'?[0,0,250]:view==='back'?[0,0,-250]:[250,0,0]),up=options.up||def.up||[0,1,0];camera.left=-span/2;camera.right=span/2;camera.top=span/2;camera.bottom=-span/2;camera.position.set(...position);camera.up.set(...up);camera.lookAt(...target);camera.updateProjectionMatrix();light.position.copy(camera.position).add(new THREE.Vector3(-90,100,60));renderer.render(scene,camera);return{view,span,target,position,up};}
window.review={model,renderer,camera,meta,show,appearance(value){for(const shell of model.group.userData.shellMeshes)applyShellAppearance(shell,value);renderer.render(scene,camera);},mask(){const saved=[];model.group.traverse(o=>{if(!o.material)return;const original=o.material;const convert=m=>new THREE.MeshBasicMaterial({color:0,map:m.map||null,alphaTest:m.alphaTest||0,transparent:m.transparent,opacity:m.opacity,side:m.side});o.material=Array.isArray(original)?original.map(convert):convert(original);saved.push([o,original,o.material]);});renderer.render(scene,camera);for(const[o,old,black]of saved){o.material=old;for(const m of [].concat(black))m.dispose();}},colors(){return Object.fromEntries(['pcb-main','pcb-back','stamp-s3a','stamp-paper','mount-screw-0'].map(name=>[name,{color:model.parts[name].material.color.getHexString(),opacity:model.parts[name].material.opacity}]));}};
show();document.body.dataset.ready='true';window.addEventListener('pagehide',()=>{model.dispose();renderer.dispose();});
</script>
