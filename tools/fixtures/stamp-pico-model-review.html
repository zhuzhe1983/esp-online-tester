<!doctype html><meta charset="utf-8"><title>Stamp Pico source review</title><style>body{margin:0;background:white}canvas{display:block}</style><div id="render"></div><script type="module">
import * as THREE from '/web/platform/vendor/three.module.min.js';
import {createManufacturerModel} from '/web/platform/manufacturer-model.js';
import {applyShellAppearance} from '/web/platform/shell-appearance.js';
const id=new URL(location.href).searchParams.get('id')||'m5stack-c050-b';
if(!['m5stack-c050-b','m5stack-k051','m5stack-k051-b'].includes(id))throw Error('Unsupported review product');
const product=(await(await fetch('/web/platform/catalog/products.json')).json()).items.find(item=>item.id===id);
const scene=new THREE.Scene();scene.background=new THREE.Color('white');scene.add(new THREE.HemisphereLight(0xffffff,0x64775b,2.5));const light=new THREE.DirectionalLight(0xffffff,3.1);scene.add(light);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(800,800,false);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#render').append(renderer.domElement);
const camera=new THREE.OrthographicCamera(-18,18,18,-18,2,3000),model=createManufacturerModel(product,null);scene.add(model.group);await model.ready;
const meta=await(await fetch(`/web/platform/assets/${id}/model.json`)).json();
function show(view='front',options={}){const def=meta.reviewViews[view]||{},span=options.span||def.span||34.8,target=options.target||def.target||[0,0,0],position=options.position||def.position||(view==='front'?[0,0,250]:view==='back'?[0,0,-250]:[250,0,0]),up=options.up||def.up||[0,1,0];camera.left=-span/2;camera.right=span/2;camera.top=span/2;camera.bottom=-span/2;camera.position.set(...position);camera.up.set(...up);camera.lookAt(...target);camera.updateProjectionMatrix();light.position.copy(camera.position).add(new THREE.Vector3(-90,100,60));renderer.render(scene,camera);return{view,span,target,position,up};}
window.review={model,renderer,camera,meta,show,appearance(value){for(const shell of model.group.userData.shellMeshes)applyShellAppearance(shell,value);renderer.render(scene,camera);},mask(){const saved=[];model.group.traverse(object=>{if(!object.material)return;const original=object.material,convert=material=>new THREE.MeshBasicMaterial({color:0,map:material.map||null,alphaTest:material.alphaTest||0,transparent:material.transparent,opacity:material.opacity,side:material.side});object.material=Array.isArray(original)?original.map(convert):convert(original);saved.push([object,original,object.material]);});renderer.render(scene,camera);for(const[object,original,black]of saved){object.material=original;for(const material of [].concat(black))material.dispose();}},materials(){const result={};model.group.traverse(object=>{if(object.material)result[object.name||object.parent?.name]={color:object.material.color?.getHexString(),opacity:object.material.opacity,texture:object.material.map?.image?.currentSrc||null};});return result;}};
show();document.body.dataset.ready='true';window.addEventListener('pagehide',()=>{model.dispose();renderer.dispose();});
</script>
