  pending.set(requestId,{resolve:finish(resolve),reject:finish(reject)});

 });
 window.addEventListener('message',receive);

 }finally{window.removeEventListener('message',receive);frame.remove();}

r.status='pass';}catch(e){r.status='failed';r.error={message:e.message,code:e.code};}window.c5EmbedReceipt=r;document.getElementById('result').textContent=JSON.stringify(r,null,2);</script>
