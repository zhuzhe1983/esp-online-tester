<!doctype html><html lang="zh"><meta charset="utf-8"><title>Waveshare browser model review</title><style>body{font:14px system-ui;margin:18px;background:#edf1ed}button{padding:12px}iframe{width:1100px;height:820px;border:1px solid #aaa}pre{white-space:pre-wrap}#result{max-height:260px;overflow:auto}</style><h1>Waveshare 工作台与嵌入验证</h1><button id="run">运行模型与场景回环检查</button><span id="status">未运行</span><pre id="result"></pre><iframe id="player" title="真实工作台"></iframe><script type="module">
import {loadCatalog,createDefaultScene,encodeScene} from './catalog.js';
const ids=["waveshare-esp32-s3-rgb-matrix-px", "waveshare-esp32-s3-lr1121-epaper-2-9", "waveshare-esp32-s3-lr1121-oled-1-54", "waveshare-esp32-s3-touch-lcd-1-85b", "waveshare-esp32-s3-touch-amoled-2-06", "waveshare-esp32-c6-touch-lcd-1-28", "waveshare-esp32-c6-touch-lcd-1-28-b", "waveshare-esp32-c6-lcd-1-28", "waveshare-esp32-c6-lcd-1-28-b", "waveshare-esp32-c6-lcd-2-73", "waveshare-esp32-c6-touch-lcd-2-8", "waveshare-esp32-c6-lcd-1-54"],report={scope:'Real browser workbench/embed RPC; WebGL availability recorded independently; no firmware or physical validation',startedAt:null,rows:[]};
const frame=document.querySelector('#player'),status=document.querySelector('#status'),result=document.querySelector('#result');
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(a,b)=>{if(!a)throw Error(b)};
async function ready(){const until=Date.now()+120000;while(Date.now()<until){const w=frame.contentWindow,d=w.document;if(w.espTester&&['ready','error','unavailable'].includes(d.querySelector('#scene-mount')?.dataset.modelStatus))return w;await delay(80);}throw Error('frame model timeout')}
async function rpc(type,id,method,args=[]){return new Promise((resolve,reject)=>{const session='waveshare_qa',origin=location.origin,timer=setTimeout(()=>{removeEventListener('message',receive);reject(Error('RPC timeout'))},15000);function receive(e){const m=e.data;if(e.source!==frame.contentWindow||e.origin!==origin||m?.channel!=='esp-workbench'||m.session!==session||m.requestId!==id)return;clearTimeout(timer);removeEventListener('message',receive);m.error?reject(Error(JSON.stringify(m.error))):resolve(m.result)}addEventListener('message',receive);frame.contentWindow.postMessage({channel:'esp-workbench',version:'1',type,session,requestId:id,method,args},origin)})}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;report.startedAt=new Date().toISOString();const catalog=await loadCatalog();for(const id of ids){status.textContent=id;const row={productId:id,checks:[]};try{let scene=createDefaultScene(catalog,id);frame.src='index.html?qa='+encodeURIComponent(id)+'#scene='+encodeScene(scene)+'&autostart=0&autoplay=0';await new Promise(r=>frame.onload=r);let w=await ready();assert(w.document.querySelector('#scene-mount').dataset.modelStatus==='ready','workbench model error');const s=await w.espTester.observe();assert(s.product.id===id&&s.scene.firmware===null,'wrong scene identity');row.webgl=w.document.querySelector('#view-3d').disabled?'unavailable':'available';row.checks.push('studio production model assets ready','exact product, no firmware');if(row.webgl==='unavailable')row.checks.push('3D renderer unavailable; 2D fallback observed');if(s.product.display&&row.webgl==='available'){w.document.querySelector('#view-2d').click();await delay(60);assert(w.document.querySelector('#view-2d').getAttribute('aria-pressed')==='true','2D switch');w.document.querySelector('#view-3d').click();await delay(60);assert(w.document.querySelector('#view-3d').getAttribute('aria-pressed')==='true','3D switch');row.checks.push('2D/3D roundtrip');}const shared=await w.espTester.share({mode:'embed',autostart:false,autoplay:false});frame.src=shared;await new Promise(r=>frame.onload=r);w=await ready();assert(w.document.querySelector('#scene-mount').dataset.modelStatus==='ready','embed model error');const hello=await rpc('hello','hello');const restored=await rpc('call','observe','observe');assert(restored.product.id===id&&restored.scene.view.mode==='embed'&&restored.scene.firmware===null,'embed restore');row.apiVersion=hello.version;row.status='passed';row.checks.push('embed model assets ready','shared scene restored','origin/session-bound iframe RPC');}catch(e){row.status='failed';row.error=e.stack;}report.rows.push(row);result.textContent=JSON.stringify(report,null,2);}report.completedAt=new Date().toISOString();result.textContent=JSON.stringify(report,null,2);status.textContent='完成 '+report.rows.filter(r=>r.status==='passed').length+'/'+ids.length;document.querySelector('#run').disabled=false;};
</script></html>
