<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperDIY PCB 照片与模型对照</title><style>body{font:16px/1.6 system-ui,sans-serif;margin:32px auto;max-width:1200px;padding:0 20px;color:#243029}h1{font-size:28px}h2{font-size:21px;margin-top:32px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}img{width:100%;background:white;border:1px solid #dce1da}figcaption{font-size:14px}code{word-break:break-all}a{color:#246b50}@media(max-width:600px){.pair{grid-template-columns:1fr}}</style>
<h1>PaperDIY PCB：官方照片与 3D 外观</h1><p>官方 Assembly Kit 的裸板资料补充 Complete Kit 的外壳 CAD。两个产品页面链接同一份原理图；模型保留原厂外壳和接口 CAD。此页核对可见板形、器件位置与材质，不证明隐藏铜层、器件高度或制造公差。完整来源、像素地标、原图和最终模型哈希见 <a href="receipt.json">receipt.json</a>。</p>
<h2>元件面</h2><div class="pair"><figure><img src="../../../../../web/platform/assets/m5stack-k159-b/assembly-board-components.webp"><figcaption>官方照片 06，原图字节未改。基板两侧直边宽 61.15 mm；天线悬伸属于 ESP32 模块。</figcaption></figure><figure><img src="paperdiy-pcb-original-components.png"><figcaption>公开“分开查看”后模型正对元件面。PCB、TF 座、金属罩、FPC 和可确认的 SMT 均为独立立体件；文字使用原图 UV 小区域。</figcaption></figure></div>
<h2>反面</h2><div class="pair"><figure><img src="../../../../../web/platform/assets/m5stack-k159-b/assembly-board-reverse.webp" style="transform:rotate(180deg)"><figcaption>官方照片 07 仅在页面中旋转 180°以匹配模型观察方向，原文件未修改。</figcaption></figure><figure><img src="paperdiy-pcb-original-reverse.png"><figcaption>背面走线外观来自原图，轮廓与孔洞由几何裁切。UNKNOWN 仅指仍未核准的内部层叠及精密封装尺寸；两张照片的可见外观有依据。</figcaption></figure></div>
<h2>高度与金属材质</h2><div class="pair"><figure><img src="../../../../../web/platform/assets/m5stack-k159-b/assembly-board-end.webp"><figcaption>官方端视图 09。独立板厚标注 1 mm，器件最大外伸约 3.1 mm；具体封装高度仍为多视角约束近似。</figcaption></figure><figure><img src="paperdiy-pcb-original-edge.png"><figcaption>模型近侧视。ESP32 屏蔽罩和 TF 外壳由现场光照计算反射，不使用整块金属照片的固定高光。</figcaption></figure></div>
<h2>整体与展示材质</h2><div class="pair"><figure><img src="paperdiy-final-inspection.png"><figcaption>外壳、显示层与 PCB 分组展开；PCB 上的元件和标识同步移动，复位恢复原坐标。</figcaption></figure><figure><img src="paperdiy-final-purple-back-oblique.png"><figcaption>紫色透明外壳。PCB、金属、插座与显示层保持自身材质。</figcaption></figure></div><p>模型中的灰色显示平面仅用于本次几何验收；运行产品时仍使用客体 framebuffer。本次没有扩展已有固件兼容结论。</p></html>
