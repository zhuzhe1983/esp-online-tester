services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/network-relay/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 384m
    cpus: 2
    environment:
      RELAY_PUBLIC_URL: https://${RELAY_DOMAIN:?Set RELAY_DOMAIN}
      RELAY_ORIGINS: ${RELAY_ORIGINS:-https://zhuzhe1983.github.io}
      RELAY_PROXY_TOKEN: ${RELAY_PROXY_TOKEN:?Generate a random proxy token}
      RELAY_DNS: ${RELAY_DNS:-1.1.1.1}
      RELAY_TCP_PORTS: ${RELAY_TCP_PORTS:-80,443,1883,8883}
      RELAY_UDP_PORTS: ${RELAY_UDP_PORTS:-123}
      RELAY_MAX_SESSIONS: ${RELAY_MAX_SESSIONS:-16}
      RELAY_MAX_SESSIONS_PER_IP: ${RELAY_MAX_SESSIONS_PER_IP:-2}
      RELAY_MAX_BYTES: ${RELAY_MAX_BYTES:-67108864}
      RELAY_BYTES_PER_SECOND: ${RELAY_BYTES_PER_SECOND:-262144}
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    ports: ["80:80", "443:443"]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN}
      RELAY_PROXY_TOKEN: ${RELAY_PROXY_TOKEN:?Generate a random proxy token}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
