; ESP32-2432S028 "Cheap Yellow Display" touch test. Build settings from
; witnessmenow/ESP32-Cheap-Yellow-Display Examples/Basics/2-TouchTest/platformio.ini (MIT),
; with the platform and libraries pinned (Arduino-ESP32 2.0.x, ESP-IDF 4.4) and the CYD2USB env dropped.
[platformio]
src_dir = src
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
lib_deps =
	bodmer/TFT_eSPI@2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DILI9341_2_DRIVER
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
