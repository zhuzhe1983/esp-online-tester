<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f5f4"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2326765c'/%3E%3Cpath d='M19 15h28v7H27v8h17v7H27v8h20v7H19z' fill='white'/%3E%3C/svg%3E"><title>ESP Player</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./firmware-download-recovery.css"><link rel="stylesheet" href="./stampfly-demo-controls.css"></head>
<body data-mode="embed">
  <main class="embed-workspace workspace" aria-label="可交互 ESP32 设备">
    <div class="workspace-toolbar"><div class="workspace-title"><span class="eyebrow">ESP / PLAYER</span><strong id="stage-title">设备预览</strong></div><div class="view-controls"><div class="segmented compact" role="group" aria-label="显示模式"><button id="view-3d" class="active" aria-pressed="true">3D</button><button id="view-2d" aria-pressed="false">2D</button></div><button id="inspect-model" class="button quiet tiny" type="button" aria-pressed="false" title="分开零件查看内部；仅用于模型观察，不代表真实拆解顺序。" hidden>分开查看</button><button id="reset-view" class="icon-button" aria-label="恢复视角">⌖</button><button id="fullscreen" class="icon-button" aria-label="全屏显示模拟器">⛶</button><a id="edit-scene" class="button quiet" href="./index.html" target="_blank" rel="noopener noreferrer">编辑 ↗</a></div></div>
    <div id="device-stage" class="device-stage"><div class="stage-grid" aria-hidden="true"></div><div id="scene-mount" class="scene-mount"></div><div class="stage-topline"><span id="runtime-badge" class="runtime-badge"><span></span>未启动</span><div class="stage-status-actions"><span id="runtime-speed" class="small-label"></span><div id="browser-audio-controls"></div></div></div><div id="screen-empty" class="screen-empty"><strong id="empty-title">准备加载设备</strong><span id="empty-description">通过共享场景配置当前设备。</span></div><div class="stage-caption"><span id="stage-gesture">拖动模型旋转 · 滚轮缩放</span><span id="model-origin" class="small-label">示意外壳 · 实际帧缓冲</span></div></div>
    <div id="firmware-run-boundary" class="notice firmware-run-boundary" role="status" hidden></div>
    <div class="transport"><div class="transport-main"><button id="start-runtime" class="button primary" disabled>▶ 启动</button><button id="pause-runtime" class="button" disabled>Ⅱ 暂停</button><button id="reset-runtime" class="button quiet" disabled>↻ 重启</button></div><div id="device-buttons" class="device-buttons"></div><button id="capture-frame" class="icon-button" title="保存屏幕截图" aria-label="保存屏幕截图" disabled>▣</button></div>
    <div id="session-tools-mount"></div>
    <details class="embed-console"><summary>串口与事件 <span id="frame-count" class="small-label">0 帧</span></summary><div class="console-header embed-console-actions"><span class="small-label">当前串口日志</span><div><div class="header-dropdown console-copy-menu"><button id="copy-console" type="button" class="button quiet tiny" data-menu-toggle aria-expanded="false" aria-haspopup="menu" aria-controls="copy-console-menu" title="复制当前所选串口保留的日志（含事件）">复制日志 <span class="menu-chevron" aria-hidden="true">⌄</span></button><div id="copy-console-menu" class="header-menu" data-menu-panel role="menu" aria-label="复制当前串口日志" hidden><button type="button" role="menuitem" data-copy-log="all">全部</button><button type="button" role="menuitem" data-copy-log="50">最近 50 条</button><button type="button" role="menuitem" data-copy-log="100">最近 100 条</button></div></div><button id="clear-console" type="button" class="button quiet tiny">清空</button></div></div><pre id="serial-output" class="serial-output" tabindex="0" aria-label="串口日志"></pre><form id="serial-form" class="serial-form"><label for="serial-port" class="sr-only">查看和发送的串口</label><select id="serial-port"><option value="usb">USB</option><option value="uart0" selected>UART0</option><option value="uart1">UART1</option></select><label class="sr-only" for="serial-input">发送文本至串口</label><input id="serial-input" placeholder="发送到设备…" autocomplete="off"><button class="button quiet" type="submit">发送 ↵</button></form></details>
    <div id="product-knowledge" class="embed-knowledge"></div>
  </main><div id="toast" class="toast" role="status" hidden></div><script type="module" src="./i18n.js"></script><script type="module" src="./bootstrap.js"></script>
</body></html>
