name: release
# Pushing a v* tag builds the release assets and attaches them to the maintainer's draft release
# for that tag (created before the push, so the release is attributed to a person); the notes and
# the Latest flag stay manual.
# workflow_dispatch rebuilds the assets for a tag that already exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: an existing v* tag to build assets for
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A tag that disagrees with the workspace version would ship mislabelled binaries.
      - name: The tag and the workspace version agree
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$tag" = "v$version" || { echo "tag $tag does not match workspace version $version"; exit 1; }
      - name: Build
        run: cargo build --release --workspace
      - name: Package
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          dir="esp32sim-${tag#v}-${{ matrix.platform }}"
          mkdir -p "dist/$dir"
          mkdir -p "dist/$dir/docs" "dist/$dir/tools"
          # Every binary the esp32sim package declares, so a new chip alias cannot be left out again.
          bins=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(" ".join(t["name"] for p in json.load(sys.stdin)["packages"] if p["name"] == "esp32sim" for t in p["targets"] if "bin" in t["kind"]))')
          test -n "$bins" || { echo "no esp32sim binaries found"; exit 1; }
          for bin in $bins; do cp "target/release/$bin" "dist/$dir/"; done
          cp LICENSE README.md "dist/$dir/"
          cp docs/quick-start.md docs/getting-started.md docs/cli.md "dist/$dir/docs/"
          cp tools/fetch-rom-elfs.sh "dist/$dir/tools/"
          tar -czf "dist/$dir.tar.gz" -C dist "$dir"
          tar -tzf "dist/$dir.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          cd dist && sha256sum *.tar.gz | tee "esp32sim-${tag#v}-SHA256SUMS.txt"
      # The maintainer creates the (draft) release before pushing the tag, so the release is
      # attributed to a person and not to github-actions; this job only attaches the assets.
      - name: Attach the assets to the maintainer's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            echo "::error::no release for $tag yet. Create the draft first, as CONTRIBUTING.md says:"
            echo "::error::  gh release create $tag --draft --target <merge commit> --title 'esp32sim ${tag#v}' --notes-file notes.md"
            echo "::error::then rerun this workflow (workflow_dispatch with tag=$tag)."
            exit 1
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dist/*.tar.gz dist/*SHA256SUMS.txt
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
